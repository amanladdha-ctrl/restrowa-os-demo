services:
  postgres:
    image: postgres:16-alpine
    container_name: restrowa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: restrowa
      POSTGRES_PASSWORD: restrowa
      POSTGRES_DB: restrowa_os
    ports:
      - "5432:5432"
    volumes:
      - restrowa-postgres-data:/var/lib/postgresql/data

volumes:
  restrowa-postgres-data:
